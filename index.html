const get = id => document.getElementById(id);
const query = get('query');
const matches = get('matches');
const detail = get('detail');
const normalize = value => value.normalize('NFKC').toLowerCase().replace(/\s+/g, '');
const currency = new Intl.NumberFormat('zh-CN', {style:'currency',currency:'CNY'});
function select(drug) {
  for (const key of ['brand','generic','form','spec','maker']) get(key).textContent = drug[key];
  get('price').textContent = drug.price === null ? '未录入' : currency.format(drug.price);
  get('photo').alt = drug.brand + '包装图';
  get('photo').src = drug.image;
  query.value = drug.brand;
  matches.hidden = true;
  get('status').textContent = '';
  detail.hidden = false;
}
query.addEventListener('input', () => {
  const keyword = normalize(query.value);
  const results = keyword ? drugs.filter(drug =>
    [drug.brand, drug.generic].some(name => normalize(name).includes(keyword))) : [];
  matches.replaceChildren();
  detail.hidden = true;
  for (const drug of results) {
    const li = document.createElement('li');
    const button = document.createElement('button');
    const spec = document.createElement('small');
    button.type = 'button';
    button.textContent = drug.brand + ' · ' + drug.generic;
    spec.textContent = drug.spec;
    button.append(spec);
    button.addEventListener('click', () => select(drug));
    li.append(button);
    matches.append(li);
  }
  matches.hidden = !results.length;
  get('status').textContent = !keyword ? '' : results.length ? '找到 ' + results.length + ' 种，点选查看单价。' : '没有找到匹配的药品。';
});
query.addEventListener('keydown', event => {
  if (event.key === 'ArrowDown' && !matches.hidden) {
    event.preventDefault();
    matches.querySelector('button').focus();
  }
  if (event.key === 'Escape') matches.hidden = true;
});
</script>
